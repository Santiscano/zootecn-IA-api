[project]
name = "zootecn-ia-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "santiago sierra cano", email = "santiscano@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.2",
    "psycopg2-binary>=2.9.13",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
zootecn-ia-api = "zootecn_ia_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
